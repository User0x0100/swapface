# FaceSwap 训练配置。
# 默认通过 `uv run python -m faceswap.train` 读取本文件；也可使用
# `uv run python -m faceswap.train --config /path/to/train.toml` 指定其他实验配置。

[train]
batch_size = 16
lr = 1.0e-4
lr_scheduler_t_max = 0
r1_reg_step = 16
r1_gamma = 10.0
bf16 = true
device = "cuda"
compile_module = true
# ckpt = "train_log/experiment/ckpt/100000.pth"
log_path = "train_log/512-BLENDFACE_ARCFACE_R50"
log_interval = 10
sample_save_every = 1000
weight_save_every = 10000

[identity]
generator_provider = "BLENDFACE"
loss_provider = "MS1MV3_ARCFACE_R50_FP16"
loss_weight = 10.0

[loss]
enable_rec_loss = true
rec_loss_weight = 10.0

[loss.wfm]
enable = true

[loss.wfm.weights]
0 = 0.1
1 = 0.1
2 = 0.1
3 = 0.1

[dataloader]
num_threads = 16
prefetch_queue_depth = 4
py_num_workers = 8
py_start_method = "spawn"
reader_prefetch_queue_depth = 2
decoder_backend = "mixed"
decoder_hw_load = 0.75
brightness = 0.2
contrast = 0.2
saturation = 0.2
flip_prob = 0.5
rotation_range = [-10.0, 10.0]
scale_factor_range = [0.7692307692307693, 1.25]
tx_range = [-0.15, 0.15]
ty_range = [-0.15, 0.15]

[generator]
img_resolution = 512
img_channels = 3
num_depth = 5
num_latent = 6
base_ch = 16
max_ch = 2048
id_dim = 512
skip = true

[discriminator]
img_resolution = 512
img_channels = 3
base_ch = 64
max_ch = 512
group_size = 4

[[src]]
path = "/opt/share/deepfake/dataset_1/ffhq_1024/realign_arcface_dst"
adjustment = 0.0

[[src]]
path = "/opt/share/deepfake/dataset_1/CelebAHQ-1024x1024/realign_arcface_dst"
adjustment = 0.0

[[dst]]
path = "/opt/share/deepfake/dataset_1/ffhq_1024/realign_arcface_dst"
adjustment = 0.0

[[dst]]
path = "/opt/share/deepfake/dataset_1/CelebAHQ-1024x1024/realign_arcface_dst"
adjustment = 0.0

[[dst]]
path = "/opt/share/deepfake/dataset_1/vggface2_hq512/align_result"
adjustment = 0.0

[[dst]]
path = "/opt/share/deepfake/dataset_1/RealOcc/image/realign_arcface_dst"
adjustment = 1.0
