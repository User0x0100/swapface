# SwapFace 训练配置示例
# 详细的 run / checkpoint / resume 约定见 docs/training.md。
#
# 使用方式：
#   新训练：uv run python -m swapface.train --config experiments/train.toml [--name NAME]
#   恢复训练：uv run python -m swapface.train --resume experiments/runs/<run_id> [--strict-precision]
#
# 本文件只描述训练实验本身。所有默认值、校验和 canonical schema 由 swapface/config.py 唯一维护。
# checkpoint 只接受当前训练语义；旧配置/旧训练状态不做迁移或 alias。

[train]
# 每个训练 batch 的样本数。当前判别器的 minibatch group_size 必须能整除该值。
batch_size = 12

# 必须显式设置：fp32 / fp16 / bf16。
precision = "fp16"

# Trainer 支持 PyTorch CUDA/HIP GPU；ROCm 也沿用 PyTorch 的 "cuda" 设备名。
device = "cuda"

# 是否编译 Generator、Discriminator、身份编码器及启用的 loss 热路径。
compile_module = true

# 日志、样本和完整 checkpoint 的保存周期，单位均为 completed step。
log_interval = 10
sample_save_every = 1000
checkpoint_save_every = 10000


[optimizer]
# Generator / Discriminator 共用的 Adam 初始学习率。
# Adam betas=(0.0, 0.99) 与 fused 实现当前固定在训练代码中，不作为实验自由度暴露。
lr = 1.0e-4


[scheduler]
# "none" 或 "cosine"。
type = "none"

# cosine 时使用；type="none" 时保留在 canonical config 中但不生效。
t_max = 20000
min_lr_ratio = 0.1


[identity]
# Generator 的 source identity 条件编码器。它属于模型条件输入，不属于 Identity Loss teacher。
provider = "BLENDFACE"


[loss.reconstruction]
# L1/VGG reconstruction 的共享作用范围：
# "same" 仅 same self-reconstruction；"all" 对 batch 内所有 src/dst pair 生效。
scope = "same"


[loss.gan]
# Generator adversarial loss 权重；Discriminator adversarial loss 固定为 1.0。
weight = 1.0


[loss.identity]
# Identity Loss teacher 与权重。
provider = "MS1MV3_ARCFACE_R50_FP16"
weight = 10.0


[loss.l1]
enable = true
weight = 8.0


[loss.r1]
enable = true

# Lazy R1：每隔多少个 completed step 执行一次；首个 step 即执行。
interval = 16

# R1 gamma。实际 lazy R1 会再乘以 interval 做间隔补偿。
gamma = 10.0


[loss.gaze]
# L2CS-Net gaze consistency：restore fake 后与 dst_canonical 比较视线方向。
enable = true
weight = 1.0
distribution_weight = 0.1
confidence_weighted = true


[loss.hrffa]
# HRFFA vitt-256 面部几何一致性损失。
enable = false
pose_weight = 1.0
eye_weight = 1.0
mouth_weight = 1.0
contour_weight = 1.0
contour_shape_weight = 0.5
occluded_geometry_weight = 0.25


[loss.facs]
# OpenGraphAU / MEFARG Stage-2 连续 FACS Action Unit 一致性损失。
enable = false
weight = 1.0
brow_weight = 1.0
eye_weight = 1.0
nose_weight = 1.0
mouth_weight = 1.0
lower_face_weight = 1.0
asymmetry_weight = 1.0


[loss.vgg]
# VGG19 perceptual reconstruction。与 L1 共用 loss.reconstruction.scope。
enable = true

[loss.vgg.weights]
conv1_2 = 2.5
conv2_2 = 2.5
conv3_3 = 2.5
conv4_3 = 2.5


[loss.wfm]
# 判别器中间特征 Weighted Feature Matching。
enable = false

[loss.wfm.weights]
0 = 0.1
1 = 0.1
2 = 0.1
3 = 0.1


[data.loader]
# 数据执行/解码后端参数。
num_threads = 16
prefetch_queue_depth = 4
py_num_workers = 8
py_start_method = "spawn"
reader_prefetch_queue_depth = 2
decoder_backend = "mixed"
decoder_hw_load = 0.75


[data.augmentation]
# src/dst 独立水平翻转；其余颜色和几何增强主要用于 dst。
brightness = 0.2
contrast = 0.2
saturation = 0.2
flip_prob = 0.5
rotation_range = [-3.0, 3.0]
scale_factor_range = [0.95, 1.05]
tx_range = [-0.05, 0.05]
ty_range = [-0.05, 0.05]


[data.sampling]
# 每个样本令 src/dst 从同一张 dst 原图构造的概率。
# scope="same" 时，L1/VGG 只作用于这些样本。
same_prob = 0.2


[generator]
# Generator / Discriminator 保持单一架构协议，不引入 architecture 选择层。
img_resolution = 256
img_channels = 3
num_depth = 4
num_latent = 8
base_ch = 64
max_ch = 512
id_dim = 512
aad_skip_layers = []


[discriminator]
img_resolution = 256
img_channels = 3
base_ch = 64
max_ch = 512

# MinibatchStd group size；batch_size 必须能被 effective group 整除。
group_size = 4


# 身份来源数据池。采样权重为 sqrt(file_count) * 2**adjustment。
[[data.src]]
path = "/path/to/source_faces_a"
adjustment = 0.0

[[data.src]]
path = "/path/to/source_faces_b"
adjustment = 0.0


# 目标/姿态/表情数据池，语义与 data.src 相同。
[[data.dst]]
path = "/path/to/target_faces_a"
adjustment = 0.0

[[data.dst]]
path = "/path/to/target_faces_b"
adjustment = 0.0

# adjustment=1.0 表示相对基础权重乘 2，可提高困难数据采样概率。
[[data.dst]]
path = "/path/to/occlusion_faces"
adjustment = 1.0
