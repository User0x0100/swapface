# SwapFace 训练配置示例
# 详细的 run / checkpoint / resume 约定见 docs/training.md。
#
# 使用方式：
#   新训练：uv run python -m swapface.train --config experiments/train.toml [--name NAME]
#   恢复训练：uv run python -m swapface.train --resume experiments/runs/<run_id> [--strict-precision]
#
# 本文件只描述训练实验本身。所有默认值、校验和 canonical schema 由 swapface/config.py 唯一维护。
# checkpoint 只接受当前训练语义；旧配置/旧训练状态不做迁移或 alias。

[train]
# 每个训练 batch 的样本数。
batch_size = 12

# 训练阶段：joint 同时训练 Coarse/HQ；coarse 或 hq 仅训练对应模块。
stage = "joint"

# 必须显式设置：fp32 / fp16 / bf16。
precision = "bf16"

# Trainer 支持 PyTorch CUDA/HIP GPU；ROCm 也沿用 PyTorch 的 "cuda" 设备名。
device = "cuda"

# 是否编译 Generator、Discriminator、身份编码器及启用的 loss 热路径。
compile_module = true

# 日志、样本和完整 checkpoint 的保存周期，单位均为 completed step。
log_interval = 10
sample_save_every = 1000
checkpoint_save_every = 10000


[optimizer.generator]
# Generator Adam。betas=(0.0, 0.99) 与 fused 实现固定在训练代码中。
lr = 1.0e-4

[optimizer.hq_discriminator]
# HQ Discriminator Adam。
lr = 1.0e-4

[optimizer.coarse_discriminator]
# Coarse Discriminator Adam。
lr = 1.0e-4


[scheduler.generator]
# "none" 或 "cosine"。
type = "none"
t_max = 20000
min_lr_ratio = 0.1

[scheduler.hq_discriminator]
type = "none"
t_max = 20000
min_lr_ratio = 0.1

[scheduler.coarse_discriminator]
type = "none"
t_max = 20000
min_lr_ratio = 0.1


[identity]
# Generator 的 source identity 条件编码器。它属于模型条件输入，不属于 Identity Loss teacher。
provider = "BLENDFACE"


[loss.coarse.reconstruction]
# Coarse L1/VGG 的共享作用范围；默认仅 same pair 做 self-reconstruction。
scope = "same"


[loss.coarse.gan]
weight = 1.0


[loss.coarse.identity]
provider = "BLENDFACE"
weight = 10.0


[loss.coarse.l1]
# false: 直接逐像素 L1；true: 先按当前分辨率做 Gaussian blur，再计算 L1。
enable = true
weight = 10.0
gaussian_blur = false


[loss.coarse.r1]
enable = true
interval = 16
gamma = 10.0


[loss.coarse.wfm]
# 判别器 encoder 中间特征的弱特征匹配；real 特征无梯度，fake 特征向 Generator 回传。
enable = false

[loss.coarse.wfm.weights]
0 = 0.5
1 = 1.0
2 = 1.0
3 = 1.0


[loss.coarse.gaze]
enable = true
weight = 1.0
distribution_weight = 0.1
confidence_weighted = true


[loss.coarse.hrffa]
enable = true
pose_weight = 1.0
eye_weight = 1.0
mouth_weight = 1.0
contour_weight = 1.0
contour_shape_weight = 0.5
occluded_geometry_weight = 0.25


[loss.coarse.facs]
enable = true
weight = 1.0
brow_weight = 1.0
eye_weight = 1.0
nose_weight = 1.0
mouth_weight = 1.0
lower_face_weight = 1.0
asymmetry_weight = 1.0


[loss.coarse.vgg]
enable = true

[loss.coarse.vgg.weights]
relu1_2 = 1.0
relu2_2 = 1.0
relu3_4 = 1.0


[loss.hq.reconstruction]
# L1/VGG reconstruction 的共享作用范围："same" 仅 self-reconstruction；"all" 为全部 pair。
scope = "same"


[loss.hq.gan]
weight = 1.0


[loss.hq.identity]
provider = "BLENDFACE"
weight = 10.0


[loss.hq.l1]
# false: 直接逐像素 L1；true: 先按当前分辨率做 Gaussian blur，再计算 L1。
enable = true
weight = 10.0
gaussian_blur = false


[loss.hq.r1]
enable = true
interval = 16
gamma = 10.0


[loss.hq.wfm]
# 判别器 encoder 中间特征的弱特征匹配。
enable = false

[loss.hq.wfm.weights]
0 = 0.5
1 = 1.0
2 = 1.0
3 = 1.0


[loss.hq.gaze]
enable = true
weight = 1.0
distribution_weight = 0.1
confidence_weighted = true


[loss.hq.hrffa]
enable = true
pose_weight = 1.0
eye_weight = 1.0
mouth_weight = 1.0
contour_weight = 1.0
contour_shape_weight = 0.5
occluded_geometry_weight = 0.25


[loss.hq.facs]
enable = true
weight = 1.0
brow_weight = 1.0
eye_weight = 1.0
nose_weight = 1.0
mouth_weight = 1.0
lower_face_weight = 1.0
asymmetry_weight = 1.0


[loss.hq.vgg]
enable = true

[loss.hq.vgg.weights]
relu1_2 = 1.0
relu2_2 = 1.0
relu3_4 = 1.0


[data.loader]
# 数据执行/解码后端参数。
num_threads = 16
prefetch_queue_depth = 4
py_num_workers = 8
py_start_method = "spawn"
reader_prefetch_queue_depth = 2
decoder_backend = "mixed"
decoder_hw_load = 0.75


[data.augmentation]
# src/dst 独立水平翻转；其余颜色和几何增强主要用于 dst。
brightness = 0.2
contrast = 0.2
saturation = 0.2
flip_prob = 0.5
rotation_range = [-10.0, 10.0]
scale_factor_range = [0.85, 1.25]
tx_range = [-0.15, 0.15]
ty_range = [-0.15, 0.15]


[data.sampling]
# 每个样本令 src/dst 从同一张 dst 原图构造的概率。
# scope="same" 时，L1/VGG 只作用于这些样本。
same_prob = 0.2


[generator]
# 唯一 Generator：旧式强 ID 注入 Coarse + HQ Refiner。
# Coarse/HQ 深度由分辨率边界自动推导，通道逐级翻倍并由 max_ch 截断。
img_resolution = 512
img_channels = 3
id_dim = 512
coarse_resolution = 128
coarse_latent_resolution = 32
coarse_num_latent = 8
coarse_base_ch = 64
coarse_max_ch = 512
hq_bottleneck_resolution = 16
hq_base_ch = 8
hq_max_ch = 128


[discriminator.hq]
# FIR_MINIBATCH_STD 或 INSTANCE_NORM_RESIDUAL。
type = "FIR_MINIBATCH_STD"
# HQ 单全局 Discriminator；FIR residual blocks 下采样到 4x4，使用 lazy R1 正则。
img_resolution = 512
img_channels = 3
base_ch = 64
max_ch = 512
minibatch_std_group_size = 4

[discriminator.coarse]
# FIR_MINIBATCH_STD 或 INSTANCE_NORM_RESIDUAL。
type = "FIR_MINIBATCH_STD"
# Coarse 单全局 Discriminator；img_resolution 必须匹配 generator.coarse_resolution。
img_resolution = 128
img_channels = 3
base_ch = 64
max_ch = 512
minibatch_std_group_size = 4


# 身份来源数据池。采样权重为 sqrt(file_count) * 2**adjustment。
# alignment 省略时默认为 ffhq；已预对齐到 canonical ArcFace 112 的 src 使用 arcface。
[[data.src]]
path = "/path/to/source_faces"
adjustment = 0.0
alignment = "ffhq"

# FairFace 后处理结果按人种目录保存；训练扫描不递归，因此每个目录分别配置。
[[data.src]]
path = "datasets/fairface-arcface112/asian"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/indian"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/black"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/white"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/middle_eastern"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/latino"
adjustment = 0.0
alignment = "arcface"


# 目标/姿态/表情数据池必须使用 FFHQ 对齐；data.dst 不接受 alignment = "arcface"。
[[data.dst]]
path = "/path/to/target_faces_a"
adjustment = 0.0
alignment = "ffhq"

[[data.dst]]
path = "/path/to/target_faces_b"
adjustment = 0.0
alignment = "ffhq"

# adjustment=1.0 表示相对基础权重乘 2，可提高困难数据采样概率。
[[data.dst]]
path = "/path/to/occlusion_faces"
adjustment = 1.0
alignment = "ffhq"
