# SwapFace 单阶段换脸训练配置；不支持旧版 Coarse/HQ 双阶段配置。
# StyleGAN2 Mask Loss 只在 type="stylegan2" 时可配置 [loss.mask] weight=1.0。

[train]
batch_size = 12
precision = "bf16"
device = "cuda"
compile_module = true
log_interval = 10
sample_save_every = 1000
checkpoint_save_every = 10000

[optimizer.generator]
lr = 1.0e-4

[optimizer.discriminator]
lr = 1.0e-4

[scheduler.generator]
type = "none"
t_max = 20000
min_lr_ratio = 0.1

[scheduler.discriminator]
type = "none"
t_max = 20000
min_lr_ratio = 0.1

[identity]
provider = "BLENDFACE"

[loss.reconstruction]
# L1/VGG 的共享作用范围；默认仅 same pair 做 self-reconstruction。
scope = "same"


[loss.gan]
weight = 1.0
# UNET 使用 BasicSR 的单一像素级 Logit 图，不再区分 Global/Spatial 权重。


[loss.identity]
provider = "BLENDFACE"
weight = 10.0
# 逐样本身份相似度软下限；达到 0.70 后 IDLoss 梯度归零。
# 0.70 是待校准的实验值，不同身份编码器需单独校准；注释这两项可恢复原 IDLoss。
min_similarity = 0.70
transition_width = 0.03
# 可选：IDLoss 梯度排除的 BiSeNet/CelebAMask 类别编号。空数组表示关闭。
# 4/5=左右眼，11=口腔内部，12/13=上下唇；例如 [4, 5, 12, 13]。
exclude_parsing_labels = []


[loss.l1]
# 0: 直接逐像素 L1；正整数 N: Gaussian blur（sigma = 当前分辨率 / N），N 越小模糊越强；384 为旧强度。
enable = true
weight = 10.0
gaussian_blur = 0


# 使用 UNET 时，采用 UNET 判别器时，R1 都强制禁用。
[loss.r1]
enable = true
interval = 16
gamma = 10.0


[loss.wfm]
# 判别器 encoder 中间特征的弱特征匹配；real 特征无梯度，fake 特征向 Generator 回传。
enable = false

[loss.wfm.weights]
0 = 0.5
1 = 1.0
2 = 1.0
3 = 1.0


[loss.gaze]
enable = true
weight = 1.0
distribution_weight = 0.1
confidence_weighted = true


[loss.smirk]
# SMIRK 官方预训练权重由 Hugging Face Hub 自动下载并缓存，文件版本与 SHA 固定。
enable = true
pose_weight = 1.0
expression_weight = 1.0
jaw_weight = 1.0
eyelid_weight = 1.0


[loss.vgg]
enable = true

[loss.vgg.weights]
relu1_2 = 1.0
relu2_2 = 1.0
relu3_4 = 1.0



[data]
# 生成器/判别器/空间监督共用对齐标准：ffhq（默认）或 arcface（FFHQ->ArcFace128 模板体系固定近似变换）。
# alignment = "arcface"

[data.loader]
# 数据执行/解码后端参数。
num_threads = 16
prefetch_queue_depth = 4
py_num_workers = 8
py_start_method = "spawn"
reader_prefetch_queue_depth = 2
decoder_backend = "mixed"
decoder_hw_load = 0.75


[data.augmentation]
# src/dst 独立水平翻转；其余颜色和几何增强主要用于 dst。
brightness = 0.2
contrast = 0.2
saturation = 0.2
flip_prob = 0.5
rotation_range = [-10.0, 10.0]
scale_factor_range = [0.85, 1.25]
tx_range = [-0.15, 0.15]
ty_range = [-0.15, 0.15]


[data.sampling]
# 每个样本令 src/dst 从同一张 dst 原图构造的概率。
# scope="same" 时，L1/VGG 只作用于这些样本。
same_prob = 0.2



# 选择单阶段 Generator；另一个版本配置整组注释，不要重复定义 [generator]
[generator]
type = "inswapper"
img_resolution = 512
id_dim = 512
latent_resolution = 32
num_latent = 6
base_ch = 64
max_ch = 256
# Decoder 从 Bottleneck 向外：0=64,1=128,2=256,3=512。
skip_mode = "cat"  # "cat" 或 "add"
skip_layers = [0, 1]

# [generator]
# type = "stylegan2"
# img_resolution = 512
# id_dim = 512
# w_dim = 512
# mapping_layers = 8
# start_resolution = 32
# channels = [64, 512]
# target_inject_mode = "concat"  # "concat" 或 "add"
# target_inject_layers = [0, 1, 2, 3, 4]
# mask_enabled = false
# mask_noise_blank_level = 9
# mask_guidance_epsilon = 1e-4
# mask_guidance_interpolation = "bilinear"

[discriminator]
type = "FIR_MINIBATCH_STD"  # 或 INSTANCE_NORM_RESIDUAL、UNET
img_resolution = 512
base_ch = 64
max_ch = 512
minibatch_std_group_size = 4

# 身份来源数据池。采样权重为 sqrt(file_count) * 2**adjustment。
# alignment 省略时默认为 ffhq；已预对齐到 canonical ArcFace 112 的 src 使用 arcface。
[[data.src]]
path = "/path/to/source_faces"
adjustment = 0.0
alignment = "ffhq"

# FairFace 后处理结果按人种目录保存；训练扫描不递归，因此每个目录分别配置。
[[data.src]]
path = "datasets/fairface-arcface112/asian"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/indian"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/black"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/white"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/middle_eastern"
adjustment = 0.0
alignment = "arcface"

[[data.src]]
path = "datasets/fairface-arcface112/latino"
adjustment = 0.0
alignment = "arcface"


# 目标/姿态/表情数据池必须使用 FFHQ 对齐；data.dst 不接受 alignment = "arcface"。
[[data.dst]]
path = "/path/to/target_faces_a"
adjustment = 0.0
alignment = "ffhq"

[[data.dst]]
path = "/path/to/target_faces_b"
adjustment = 0.0
alignment = "ffhq"

# adjustment=1.0 表示相对基础权重乘 2，可提高困难数据采样概率。
[[data.dst]]
path = "/path/to/occlusion_faces"
adjustment = 1.0
alignment = "ffhq"

# 可选在线遮挡增强；不设置该段时完全禁用、也不加载 OCC 模型。
# 已处理的 NatOcc 素材：Hugging Face 私有 Dataset leehx/swapface-occluders
# 先按 docs/training.md 的步骤离线下载/解压；assets_dir 必须为本地 RGBA 图片目录。
# [data.occlusion]
# prob = 0.2                        # 每张图应用遮挡的概率，0~1（不是空间百分比）
# assets_dir = "/workspace/datasets/swapface-occluders/rgba"  # 留空则使用程序化 RandOcc
# size_range_pct = [40.0, 90.0]     # 遮挡物最长边占训练图像边长的百分比（允许 > 100%）
# center_x_range_pct = [-15.0, 15.0] # 遮挡中心相对图像中心的水平偏移，单位为图像边长百分比
# center_y_range_pct = [-15.0, 15.0] # 遮挡中心相对图像中心的垂直偏移，单位为图像边长百分比
# rotation_range_deg = [-40.0, 40.0] # 遮挡物旋转角度范围，单位为度
