[project]
name = "swap"
version = "0.1.0"
description = "Experimental SwapFace training workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy",
    "onnx",
    "onnxscript",
    "opencv-python",
    "pillow",
    "tensorboard",
    "tqdm",
    "fvcore",
    "torchinfo",
    "timm>=1.0.0",
    "ninja",
    "scipy",
    "httpx[socks]>=0.28.1",
    "pyarrow>=25.0.1",
]

[dependency-groups]
# 仅 NVIDIA 训练运行时；使用 `uv sync --locked --only-group nvidia-train`，
# 排除 [project].dependencies 中的预览、导出及数据预处理工具。
nvidia-train = [
    "torch",
    "torchvision",
    "numpy",
    "opencv-python",
    "pillow",
    "huggingface-hub>=1.32.0",
    "tensorboard",
    "tqdm",
    "timm>=1.0.0",
    "segmentation-models-pytorch",
    "nvidia-dali-cuda120",
    "ninja",
]
nvidia = [
    "segmentation-models-pytorch",
    "torch",
    "torchvision",
    "torchcodec",
    "nvidia-dali-cuda120",
    "onnxruntime-gpu",
    "xformers",
    "tensorrt-cu12",
]
rocm = [
    "segmentation-models-pytorch",
    "torch",
    "torchvision",
    "triton-rocm",
]

[tool.uv]
package = false
default-groups = []
# Training and export tools in this repository target Linux x86_64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# NVIDIA uses public CUDA/DALI indexes; ROCm uses its own official index.
conflicts = [
    [{ group = "nvidia" }, { group = "rocm" }],
    [{ group = "nvidia-train" }, { group = "rocm" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "nvidia" },
    { index = "pytorch-cu126", group = "nvidia-train" },
    { index = "pytorch-rocm", group = "rocm" },
]
torchvision = [
    { index = "pytorch-cu126", group = "nvidia" },
    { index = "pytorch-cu126", group = "nvidia-train" },
    { index = "pytorch-rocm", group = "rocm" },
]
torchcodec = { index = "pytorch-cu126", group = "nvidia" }
triton-rocm = { index = "pytorch-rocm", group = "rocm" }
nvidia-dali-cuda120 = [
    { index = "nvidia-pypi", group = "nvidia" },
    { index = "nvidia-pypi", group = "nvidia-train" },
]
tensorrt-cu12 = { index = "nvidia-pypi", group = "nvidia" }

# NVIDIA CUDA 12.6 PyTorch wheel index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ROCm 不更换源。
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com/"
explicit = true

# Common dependencies use the public PyPI index. Keep all named sources publicly
# reachable: uv resolves every dependency group when updating the shared lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.ruff]
line-length = 230
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = false
