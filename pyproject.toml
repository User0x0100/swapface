[project]
name = "swap"
version = "0.1.0"
description = "Experimental SwapFace training workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy",
    "onnx",
    "onnxscript",
    "opencv-python",
    "pillow",
    "tensorboard",
    "tqdm",
    "fvcore",
    "torchinfo",
    "ninja",
    "scipy",
    "httpx[socks]>=0.28.1",
]

[dependency-groups]
cuda = [
    "segmentation-models-pytorch",
    "torch",
    "torchvision",
    "torchcodec",
    "nvidia-dali-cuda120",
    "onnxruntime-gpu",
    "xformers",
    "tensorrt-cu12",
]
rocm = [
    "segmentation-models-pytorch",
    "torch",
    "torchvision",
    "triton-rocm",
]

[tool.uv]
package = false
default-groups = []
conflicts = [
    [
        { group = "cuda" },
        { group = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cuda" },
    { index = "pytorch-rocm", group = "rocm" },
]
torchvision = [
    { index = "pytorch-cu126", group = "cuda" },
    { index = "pytorch-rocm", group = "rocm" },
]
torchcodec = { index = "pytorch-cu126", group = "cuda" }
triton-rocm = { index = "pytorch-rocm", group = "rocm" }
nvidia-dali-cuda120 = { index = "nvidia" }
tensorrt-cu12 = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.ruff]
line-length = 230
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = false
