[project]
name = "swap"
version = "0.1.0"
description = "Experimental face-swap training workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nvidia-dali-cuda120",
    "torch",
    "torchvision",
    "torchcodec",
    "huggingface-hub",
    "modelscope-hub",
    "numpy",
    "onnx",
    "onnxscript",
    "onnxruntime-gpu",
    "opencv-python",
    "tensorboard",
    "tqdm",
    "segmentation-models-pytorch",
    "fvcore",
    "xformers",
    "torchinfo",
    "ninja",
    "scipy",
    "tensorrt-cu12",
    "httpx[socks]>=0.28.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
nvidia-dali-cuda120 = { index = "nvidia" }
tensorrt-cu12 = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.ruff]
line-length = 230
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = false
